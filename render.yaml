services:
  # Primary API service
  - type: web
    name: recoverx-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    healthCheckInterval: 10
    numInstances: 2
    maxShutdownDelay: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AUTH_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_RAZORPAY_ACCOUNT_ID
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "28800"
      - key: PAYMENT_LINK_TTL_HOURS
        value: "72"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: LLM_PROVIDER
        value: deterministic
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: recoverx-redis
          property: connectionString
      # IMPORTANT: After first deploy, replace the placeholder URLs with your actual Render-assigned URLs.
      # Go to Render Dashboard → each service → Settings → Environment to update these values.
      - key: CORS_ORIGINS
        value: "https://recoverx-frontend.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api.onrender.com"

  # Frontend service
  - type: web
    name: recoverx-frontend
    runtime: docker
    rootDir: frontend
    plan: starter
    numInstances: 1
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      # IMPORTANT: Set this to the actual Render API service URL after first deploy.
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api.onrender.com"

  # Background worker for async tasks (optional - set TEMPORAL_ENABLED=true to enable)
  - type: background_worker
    name: recoverx-worker
    runtime: docker
    rootDir: backend
    plan: starter
    numInstances: 1
    maxShutdownDelay: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AUTH_SECRET
        sync: false
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: TEMPORAL_HOST
        value: localhost:7233
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: recoverx-redis
          property: connectionString
    startCommand: python -m app.workflows.temporal_worker

  # Redis cache
  - type: redis
    name: recoverx-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # PostgreSQL database using standard managed blueprint
  - type: pserv
    name: recoverx-postgres
    plan: starter
    databaseName: recoverx
    databaseUser: recoverx
    # postgreSQL version should be 13+
    # Initialize with full UTF8 support
    ipAllowList: []

# Cron jobs for maintenance (optional)
jobs:
  - type: cron
    name: recoverx-cleanup
    schedule: "0 2 * * *"  # 2 AM daily
    runtime: docker
    rootDir: backend
    startCommand: |
      python -c "
      from sqlalchemy import select
      from app.db import PaymentLink, get_session, utc_now
      from app.core.config import settings
      session = next(get_session())
      expired = session.query(PaymentLink).filter(
        PaymentLink.expires_at <= utc_now(),
        PaymentLink.status != 'EXPIRED'
      ).update({'status': 'EXPIRED'})
      session.commit()
      print(f'Marked {expired} expired payment links')
      "
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString

