databases:
  - name: recoverx-postgres
    plan: starter
    databaseName: recoverx
    user: recoverx
    ipAllowList: []

services:
  # ============================================================
  # RecoverX API
  # ============================================================
  - type: web
    name: recoverx-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    maxShutdownDelaySeconds: 30
    preDeployCommand: alembic upgrade head

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: SEED_DEMO_DATA
        value: "false"

      - key: AUTH_REQUIRED
        value: "true"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: AUTH_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      - key: BOOTSTRAP_RAZORPAY_ACCOUNT_ID
        sync: false

      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "28800"

      - key: PAYMENT_LINK_TTL_HOURS
        value: "72"

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: PAYMENT_PROVIDER
        value: simulated

      - key: LLM_PROVIDER
        value: deterministic

      - key: TEMPORAL_ENABLED
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recoverx-redis
          property: connectionString

      # Replace after Render assigns the real frontend URL.
      - key: CORS_ORIGINS
        value: "https://recoverx-frontend-placeholder.onrender.com"

      # Replace after Render assigns the real API URL.
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api-placeholder.onrender.com"


  # ============================================================
  # RecoverX Frontend
  # ============================================================
  - type: web
    name: recoverx-frontend
    runtime: docker
    rootDir: frontend
    plan: starter
    numInstances: 1

    # Docker services use the Dockerfile CMD by default.
    # Override it explicitly with dockerCommand.
    dockerCommand: npm run start

    envVars:
      # Replace after Render assigns the real API URL.
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api-placeholder.onrender.com"


  # ============================================================
  # RecoverX Background Worker
  # ============================================================
  - type: worker
    name: recoverx-worker
    runtime: docker
    rootDir: backend
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 30

    # TEMPORAL_ENABLED=false for initial deployment.
    # The worker remains harmless while Temporal is disabled.
    dockerCommand: python -m app.workflows.temporal_worker

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: AUTH_SECRET
        sync: false

      - key: TEMPORAL_ENABLED
        value: "false"

      - key: TEMPORAL_HOST
        value: localhost:7233

      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recoverx-redis
          property: connectionString


  # ============================================================
  # RecoverX Redis / Key Value
  # ============================================================
  - type: keyvalue
    name: recoverx-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru


  # ============================================================
  # Daily Cleanup Cron
  # ============================================================
  - type: cron
    name: recoverx-cleanup
    schedule: "0 2 * * *"
    runtime: docker
    rootDir: backend

    # Docker cron jobs use dockerCommand instead of startCommand.
    dockerCommand: >-
      python -c "from app.db import PaymentLink, get_session, utc_now;
      session = next(get_session());
      expired = session.query(PaymentLink).filter(
      PaymentLink.expires_at <= utc_now(),
      PaymentLink.status != \"EXPIRED\"
      ).update({\"status\": \"EXPIRED\"});
      session.commit();
      print(f\"Marked {expired} expired payment links\")"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString