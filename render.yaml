databases:
  - name: recoverx-postgres
    plan: starter
    databaseName: recoverx
    user: recoverx
    ipAllowList: []

services:
  # Primary API service
  - type: web
    name: recoverx-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    healthCheckInterval: 10
    numInstances: 1
    maxShutdownDelay: 30
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AUTH_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_RAZORPAY_ACCOUNT_ID
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "28800"
      - key: PAYMENT_LINK_TTL_HOURS
        value: "72"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: LLM_PROVIDER
        value: deterministic
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recoverx-redis
          property: connectionString
      # Post-deployment: update CORS_ORIGINS with the actual assigned recoverx-frontend URL
      - key: CORS_ORIGINS
        value: "https://recoverx-frontend-placeholder.onrender.com"
      # Post-deployment: update NEXT_PUBLIC_API_URL with the actual assigned recoverx-api URL
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api-placeholder.onrender.com"

  # Frontend service
  - type: web
    name: recoverx-frontend
    runtime: docker
    rootDir: frontend
    plan: starter
    numInstances: 1
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      # Post-deployment: update NEXT_PUBLIC_API_URL with the actual assigned recoverx-api URL
      - key: NEXT_PUBLIC_API_URL
        value: "https://recoverx-api-placeholder.onrender.com"

  # Background worker for async tasks (TEMPORAL_ENABLED=false for initial deployment)
  - type: worker
    name: recoverx-worker
    runtime: docker
    rootDir: backend
    plan: starter
    numInstances: 1
    maxShutdownDelay: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AUTH_SECRET
        sync: false
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: TEMPORAL_HOST
        value: localhost:7233
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recoverx-redis
          property: connectionString
    startCommand: python -m app.workflows.temporal_worker

  # Redis / Key Value cache
  - type: keyvalue
    name: recoverx-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Cron job for daily maintenance
  - type: cron
    name: recoverx-cleanup
    schedule: "0 2 * * *"
    runtime: docker
    rootDir: backend
    startCommand: |
      python -c "
      from sqlalchemy import select
      from app.db import PaymentLink, get_session, utc_now
      from app.core.config import settings
      session = next(get_session())
      expired = session.query(PaymentLink).filter(
        PaymentLink.expires_at <= utc_now(),
        PaymentLink.status != 'EXPIRED'
      ).update({'status': 'EXPIRED'})
      session.commit()
      print(f'Marked {expired} expired payment links')
      "
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverx-postgres
          property: connectionString
